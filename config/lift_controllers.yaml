# ros2_control 升降杆控制器配置

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # 控制器列表
    lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


# 升降杆轨迹控制器
lift_controller:
  ros__parameters:
    joints:
      - lift_joint
      - tilt_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # 轨迹容差
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: true
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

      lift_joint:
        trajectory: 0.1
        goal: 0.02

      tilt_joint:
        trajectory: 0.1
        goal: 0.02


# 关节状态广播器
joint_state_broadcaster:
  ros__parameters:
    joints:
      - lift_joint
      - tilt_joint
