# SLAM Toolbox configuration for patrol robot
# 针对 200平方米 配电室优化

slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # === 大房间优化参数 ===
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0          # 更频繁更新地图 (原5.0)
    resolution: 0.05
    max_laser_range: 12.0             # 增大激光范围 (原10.0)
    minimum_time_interval: 0.2        # 更频繁处理 (原0.5)
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # === 扫描匹配优化 (防止漂移) ===
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2      # 更频繁添加节点 (原0.5)
    minimum_travel_heading: 0.2       # 更频繁添加节点 (原0.5)
    scan_buffer_size: 20              # 增加缓存 (原10)
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.15  # 稍微提高阈值
    link_scan_maximum_distance: 2.0   # 增大链接距离 (原1.5)

    # === 回环检测优化 (解决地图扭曲) ===
    do_loop_closing: true
    loop_search_maximum_distance: 8.0  # 增大搜索范围 (原3.0)
    loop_match_minimum_chain_size: 6   # 减小链长度要求 (原10)
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.3   # 降低阈值更容易匹配
    loop_match_minimum_response_fine: 0.4     # 降低阈值

    # === 相关搜索空间 (提高匹配精度) ===
    correlation_search_space_dimension: 0.6   # 增大搜索空间 (原0.5)
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # === 回环搜索空间 ===
    loop_search_space_dimension: 10.0         # 增大 (原8.0)
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # === 扫描匹配器参数 ===
    distance_variance_penalty: 0.3    # 降低惩罚 (原0.5)
    angle_variance_penalty: 0.8       # 降低惩罚 (原1.0)
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
