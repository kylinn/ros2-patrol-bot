# Patrol Robot Configuration
# Waypoints are in the map frame, format: "x,y,yaw_degrees"
# Room is 10x10m (-5 to 5), with interior walls at (-2,2) and (2,-1)

patrol_node:
  ros__parameters:
    # Output directory for captured images
    output_dir: "/mnt/d/TbbRobot/patrol_output"

    # Initial robot pose (where robot starts in the map)
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0

    # Patrol waypoints: "x,y,yaw_degrees"
    # Waypoints in a small square pattern around origin
    patrol_points:
      - "1.0,0.0,0"
      - "1.0,1.0,90"
      - "0.0,1.0,180"
      - "0.0,0.0,270"

    # Loop patrol continuously
    loop_patrol: true
