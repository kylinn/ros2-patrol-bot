explore_node:
  ros__parameters:
    robot_base_frame: base_footprint
    return_to_init: true
    # 使用 SLAM 生成的地图
    costmap_topic: map
    costmap_updates_topic: map_updates
    visualize: true
    # 探索频率 (Hz) - 更频繁地寻找新边界
    planner_frequency: 0.33
    # 进度超时 (秒) - 如果无法到达目标，切换到其他边界
    progress_timeout: 60.0
    # 边界选择参数
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.5
    # 最小边界大小 (米) - 配电室空间较大，适当增大
    min_frontier_size: 0.5
    use_sim_time: true
